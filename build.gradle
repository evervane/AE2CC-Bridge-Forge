plugins {
    id 'net.minecraftforge.gradle' version '6.0.16'
}
version = '1.0.0'
group = 'io.github.themrmilchmann.ae2cc'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'
}
repositories {
    maven { url 'https://maven.aliyun.com/repository/public' }
    maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
    flatDir { dir 'libs' }
}
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
    compileOnly fg.deobf("libs:appliedenergistics2-forge:15.4.10")
    compileOnly fg.deobf("libs:cc-tweaked-1.20.1-forge:1.120.2")
}
task printClasspath {
    doLast {
        sourceSets.main.compileClasspath.files.each { println it }
    }
}
